<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23eee9df' stroke-width='1.5'/%3E%3Ccircle cx='25' cy='16' r='3.2' fill='%23ff4d12'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="grid"></i><i class="noise"></i></div>
<header>
  <a class="brand" href="/" aria-label="Motion Studio">
    <svg class="mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
      <circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".3"/>
      <g class="orbit"><circle cx="26" cy="16" r="3.2" fill="#ff4d12"/><circle cx="26" cy="16" r="6" fill="#ff4d12" opacity=".25" class="halo"/></g>
    </svg>
    <span class="word">MOTION<b>STUDIO</b></span>
  </a>
  <nav id="tabs" aria-label="Workflow"></nav>
  <div class="right">
    <span id="activity" class="activity" title="Idle"><i></i><i></i><i></i><i></i><span class="t">idle</span></span>
    <span id="projname" class="projname"></span>
    <button id="btnProjects" class="ghost">Projects</button>
    <button id="btnSettings" class="ghost">Settings</button>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body></html>
